services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: saas_db
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_password
    ports:
      - "54320:5432"
    volumes:
      - saas_data:/var/lib/postgresql/data
 
  # web:
  #   build: .
  #   restart: always
  #   command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
  #   volumes:
  #     - .:/app
  #   ports:
  #     - "8000:8000"
  #   env_file:
  #     - .env
  #   environment:
  #     - DJANGO_SETTINGS_MODULE=config.settings.production
  #   depends_on:
  #     - db
  web:
    build: .
    restart: always
    # موقتا از سرور خود جنگو برای تست استفاده می‌کنیم تا فایل‌های استاتیک لود شوند
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    depends_on:
      - db
volumes:
  saas_data: # والیوم اختصاصی ایزوله شده بدون خطر حذف اتفاقی